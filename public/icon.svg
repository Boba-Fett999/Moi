<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- App Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.6" />

  <!-- Piano Keyboard Graphic -->
  <g transform="translate(64, 180)">
    <!-- White Keys -->
    <rect x="0" y="80" width="46" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="48" y="80" width="46" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="96" y="80" width="46" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="144" y="80" width="46" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="192" y="80" width="46" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="240" y="80" width="46" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="288" y="80" width="46" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="336" y="80" width="46" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

    <!-- Active Glow on Keys -->
    <rect x="48" y="195" width="46" height="35" rx="4" fill="#06b6d4" opacity="0.8" />
    <rect x="192" y="195" width="46" height="35" rx="4" fill="#f43f5e" opacity="0.8" />
    <rect x="288" y="195" width="46" height="35" rx="4" fill="#a855f7" opacity="0.8" />

    <!-- Black Keys -->
    <rect x="32" y="80" width="28" height="90" rx="5" fill="#0f172a" />
    <rect x="80" y="80" width="28" height="90" rx="5" fill="#0f172a" />
    <rect x="176" y="80" width="28" height="90" rx="5" fill="#0f172a" />
    <rect x="224" y="80" width="28" height="90" rx="5" fill="#0f172a" />
    <rect x="272" y="80" width="28" height="90" rx="5" fill="#0f172a" />
  </g>

  <!-- Cascading Solfege Waterfall Bars -->
  <g transform="translate(64, 90)">
    <rect x="48" y="20" width="46" height="60" rx="10" fill="url(#cyan-glow)" filter="drop-shadow(0 4px 12px rgba(6,182,212,0.6))" />
    <text x="71" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">RÉ</text>

    <rect x="192" y="-10" width="46" height="80" rx="10" fill="url(#accent)" filter="drop-shadow(0 4px 12px rgba(244,63,94,0.6))" />
    <text x="215" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">SOL</text>

    <rect x="288" y="10" width="46" height="65" rx="10" fill="#a855f7" filter="drop-shadow(0 4px 12px rgba(168,85,247,0.6))" />
    <text x="311" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">SI</text>
  </g>

  <!-- Musical Clef & Solfege Badge -->
  <circle cx="256" cy="445" r="28" fill="url(#accent)" />
  <path d="M256 430 L256 458 M248 440 L264 436 M256 432 C262 432 267 435 267 440 C267 445 262 447 256 447" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>
